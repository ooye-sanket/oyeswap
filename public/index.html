<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Fast peer-to-peer file transfer on local network with ephemeral chat" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/media/favicon.svg" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OyeSwap" />
  <link rel="apple-touch-icon" href="/media/icon-192.png" />

  <link rel="stylesheet" href="/style.css" />

  <style>
    .receive-box { min-height: 80px; padding:10px; }
    .receive-card { background:#fff; padding:8px; margin:8px 0; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .progress { background:#eee; height:10px; border-radius:6px; overflow:hidden; margin-top: 5px; }
    .progress-bar { height:10px; width:0%; background:#4caf50; transition: width 0.2s; }
    .hidden { display:none; }
    .button-group { display:flex; gap:10px; margin-top:10px; }
    .button-group button { flex:1; padding:10px; cursor:pointer; }
  </style>
</head>

<body>

<div id="pwa-splash-screen" class="pwa-splash">
  <div class="splash-content"> 
    <div class="logo-stomp">
      <img src="/media/icon-192.png" alt="OyeSwap Logo" class="splash-logo" />
    </div>
    
    <h1 class="app-name">OyeSwap</h1>

    <div class="loading-dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</div>

<style>

.pwa-splash {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, #6e5cf2 0%, #7952f0 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  opacity: 1;
  transition: opacity 0.5s ease;
}

.pwa-splash.hidden {
  opacity: 0;
  pointer-events: none;
}

.splash-content {
  text-align: center;
}

/* Logo Image Styling */
.splash-logo {
  width: 120px;
  height: 120px;
  object-fit: contain;
  filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.3));
}

/* Stomp Animation for Logo */
.logo-stomp {
  animation: stomp 1.2s cubic-bezier(0.36, 0, 0.66, -0.56) forwards;
  transform-origin: center bottom;
}

@keyframes stomp {
  0% {
    transform: scale(0) translateY(-100px);
    opacity: 0;
  }
  50% {
    transform: scale(1.3) translateY(15px);
    opacity: 1;
  }
  65% {
    transform: scale(0.85) translateY(-5px);
  }
  80% {
    transform: scale(1.1) translateY(3px);
  }
  100% {
    transform: scale(1) translateY(0);
    opacity: 1;
  }
}

/* App Name Animation */
.app-name {
  font-size: 32px;
  font-weight: 700;
  color: white;
  margin: 24px 0;
  opacity: 0;
  animation: fadeInUp 0.6s ease 0.8s forwards;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Loading Dots */
.loading-dots {
  display: flex;
  gap: 8px;
  justify-content: center;
  opacity: 0;
  animation: fadeIn 0.4s ease 1.2s forwards;
}

.loading-dots span {
  width: 8px;
  height: 8px;
  background: white;
  border-radius: 50%;
  animation: bounce 1.4s infinite ease-in-out;
}

.loading-dots span:nth-child(1) {
  animation-delay: 0s;
}

.loading-dots span:nth-child(2) {
  animation-delay: 0.2s;
}

.loading-dots span:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes bounce {
  0%, 80%, 100% {
    transform: scale(0.8);
    opacity: 0.5;
  }
  40% {
    transform: scale(1.2);
    opacity: 1;
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

/* Dark mode support */
body.dark .pwa-splash {
  background: linear-gradient(135deg, #1a1520 0%, #2a1f3a 100%);
}

/* Responsive */
@media (max-width: 768px) {
  .splash-logo {
    width: 100px;
    height: 100px;
  }
  
  .app-name {
    font-size: 28px;
  }
}
</style>

<script>
// PWA Splash Screen Controller
(function() {
  const splash = document.getElementById('pwa-splash-screen');
  
  // Check if running as PWA
  const isPWA = window.matchMedia('(display-mode: standalone)').matches || 
                window.navigator.standalone || 
                document.referrer.includes('android-app://');
  
  if (isPWA && splash) {
    // Show splash for 2 seconds
    setTimeout(() => {
      splash.classList.add('hidden');
      // Remove from DOM after animation
      setTimeout(() => {
        splash.remove();
      }, 500);
    }, 2000);
  } else {
    // Not PWA - remove splash immediately
    if (splash) splash.remove();
  }
})();
</script>
<!-- UPDATED HEADER -->

    <div id="myDeviceName" class="device-name">Set your device name</div>

      </svg>

  </div>

  <div style="display:flex; gap:8px;">
    <button id="installBtn" class="theme-btn" style="display:none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>

    </button>

    <button id="themeToggle" class="theme-btn">

        <circle cx="12" cy="12" r="5"></circle>
      </svg>
      <svg class="moon-icon" style="display:none;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3"></path>
      </svg>
    </button>
  </div>
</header>

<section class="info-box">
  To transfer files, open OyeSwap on both devices connected to the same Wi-Fi or local network.
  <br><small>Maximum file size: 10GB</small>
</section>

<main class="layout">

<section class="left-column">
<div class="inner-grid">

<section class="card send-section">
  <h2>Send Files</h2>

  <div id="dropZone" class="drop-zone">Drag & drop files or folders here</div>

  <!-- UPDATED BUTTON GROUP -->
  <div class="button-group">
    <button onclick="document.getElementById('fileInputFiles').click()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:6px;">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
        <polyline points="13 2 13 9 20 9"></polyline>
      </svg>
      Select Files
    </button>

    <button onclick="document.getElementById('fileInputFolders').click()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:6px;">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
      </svg>
      Select Folder
    </button>
  </div>

  <input type="file" id="fileInputFiles" multiple class="hidden" />
  <input type="file" id="fileInputFolders" webkitdirectory class="hidden" />

  <div id="filePreview" class="file-preview hidden"></div>

  <label>Select devices:</label>
  <div id="deviceCheckboxList" class="device-check-list"></div>

  <button id="sendBtn" disabled>Send</button>
  <p id="sendMsg"></p>
</section>

<div class="right-stack">

<section class="card">
  <h2>Receive</h2>
  <div id="receiveBox" class="receive-box">
    Waiting for incoming files...
    <div id="progressArea"></div>
  </div>
</section>

<section class="card">
  <h2>Connected Devices</h2>
  <div id="devices" class="device-list"></div>
</section>

</div>
</div>
</section>

<!-- CHAT -->
<section class="right-column">
<div class="chat-container">

<div class="chat-header">
  <h2>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
    Ephemeral Chat
    <span class="chat-status" id="chatStatus">Active</span>
  </h2>

  <div class="chat-user-selector">
    <label>Chat with:</label>
    <select id="chatUserSelect">
      <option value="">Select a user...</option>
    </select>
  </div>

  <div id="onlineUsersList"></div>
</div>

<div class="chat-messages" id="chatMessages"></div>

<div class="chat-input-area">
  <div class="chat-input-row">
    <input id="chatInput" disabled placeholder="Type your message..." />
    <button id="chatSendBtn" disabled>Send</button>
  </div>

  <div class="chat-actions">
    <button id="burnChatBtn" class="chat-action-btn burn-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;">
        <path d="M12 2c-4.4 0-8 3.6-8 8s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8z"></path>
        <path d="M8 12l2 2 4-4"></path>
      </svg>
      Burn All
    </button>

    <button id="leaveChatBtn" class="chat-action-btn leave-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px;">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Leave Chat
    </button>
  </div>
</div>

</div>
</section>

</main>

<div id="popup" class="popup hidden"></div>

<div id="approvalModal" class="approval-modal hidden">
  <div class="approval-content">
    <h2>Incoming Files</h2>
    <p id="approvalSender"></p>
    <div id="approvalFileList"></div>
    <p id="approvalTotalSize"></p>
    <div class="approval-buttons">
      <button id="approvalAccept">Accept</button>
      <button id="approvalReject">Reject</button>
    </div>
  </div>
</div>
